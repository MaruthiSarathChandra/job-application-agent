    public_official_relationship: ""
    public_official_institution_level: ""
    relative_senior_commercial_person: "REVIEW"
    senior_commercial_relationship: ""
    senior_commercial_institution_level: ""
    recruitment_option: "REVIEW"
    name_and_agency: "REVIEW"

# Optional email-verification automation. `manual` keeps OTP/email verification
# as a browser handoff. `gmail_api` uses Google's OAuth flow and Gmail readonly
# scope. OAuth client secrets and per-mailbox tokens are local-only and ignored
# by git. Verification codes are used ephemerally and are never logged or saved.
email_verification:
  mode: "manual"  # manual | gmail_api
  gmail:
    client_secret_file: "secrets/gmail_oauth_client.json"
    token_dir: "data/gmail_tokens"
    poll_seconds: 60
    # Add only domains you explicitly trust for verification links that redirect
    # outside the current ATS/career-site hostname.
    trusted_link_domains: []

# If you maintain more than one truthful resume/email identity, use separate
# local profile files (for example candidate_profile_a.yaml and
# candidate_profile_b.yaml) and run with --profile. Do not mix or fabricate
# employers, dates, experience length, work authorization, or legal answers.

submission:
  # manual is the recommended/default mode during validation.
  # auto_if_safe is permitted only after all adapter/policy checks pass.
  mode: "manual"

safety:
  llm_min_confidence: 0.97
